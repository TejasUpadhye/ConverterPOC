<body>

<div class="card">
  <div class="card-head">
    <div class="logo">FC</div>

      FileConvert Pro

  </div>

      <div class="drop-icon">&#128196;</div>

      <input type="file" id="file-upload" />
      <div class="filename" id="filename">No file selected</div>

    <div class="statusline">

      <span id="status">Ready</span>

    <span>Avg. conversion time ~10s</span>

</div>

<script>
(function () {
  var CONVERT_MS = 10000;

  var input  = document.getElementById('file-upload');
  var drop   = document.getElementById('drop');
  var fname  = document.getElementById('filename');
  var btn    = document.getElementById('convert-btn');
  var track  = document.getElementById('track');
  var bar    = document.getElementById('bar');
  var dot    = document.getElementById('dot');
  var status = document.getElementById('status');
  var eta    = document.getElementById('eta');
  var link   = document.getElementById('download-link');

  input.addEventListener('change', function () {
    var f = input.files[0];
    if (f) {
      drop.classList.add('has-file');
      fname.textContent = f.name;
    } else {
      drop.classList.remove('has-file');
      fname.textContent = 'No file selected';
    }
  });

  btn.addEventListener('click', function () {
    var f = input.files[0];
    if (!f) {
      status.textContent = 'Select a file first';
      return;
    }

    // reset
    link.style.display = 'none';
    btn.disabled = true;
    track.classList.add('on');
    bar.style.width = '0%';
    dot.className = 'dot busy';
    status.className = 'busy';
    status.textContent = 'Converting';

    var started = Date.now();
    var timer = setInterval(function () {
      var pct = Math.min(100, (Date.now() - started) / CONVERT_MS * 100);
      bar.style.width = pct.toFixed(1) + '%';
      var left = Math.max(0, CONVERT_MS - (Date.now() - started)) / 1000;
      eta.textContent = left.toFixed(1) + 's';
    }, 100);

    setTimeout(function () {
      clearInterval(timer);
      bar.style.width = '100%';
      eta.textContent = '';

      // Padded so the output is a realistic size, not 68 bytes.
      var pdf = '%PDF-1.4\n'
              + '1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n'
              + '2 0 obj<</Type/Pages/Count 1>>endobj\n'
              + '% ' + new Array(2001).join('x') + '\n'
              + 'trailer<</Root 1 0 R>>\n%%EOF';

      var blob = new Blob([pdf], { type: 'application/pdf' });
      link.href = URL.createObjectURL(blob);
      link.download = f.name.replace(/\.[^.]+$/, '') + '-converted.pdf';
      link.style.display = 'block';

      dot.className = 'dot done';
      status.className = 'done';
      status.textContent = 'Conversion complete';
      btn.disabled = false;
    }, CONVERT_MS);
  });
})();
</script>
